<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>インセイン キャラクター駒生成ツール v0.3 Debug</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d0b12;color:#fff;margin:0}
main{max-width:980px;margin:auto;padding:40px 20px}
.card{background:#1c1724;border:1px solid #443850;border-radius:18px;padding:24px;margin:20px 0}
input,textarea,button{font:inherit}
input,textarea{box-sizing:border-box;width:100%;background:#0d0b12;color:#fff;border:1px solid #62536f;border-radius:10px;padding:12px}
button{background:#ad72ff;color:#09060d;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;margin:8px 8px 8px 0}
.secondary{background:#30283a;color:#fff;border:1px solid #62536f}
pre{white-space:pre-wrap;word-break:break-all;background:#09080c;padding:16px;border-radius:10px;max-height:600px;overflow:auto}
.status{margin-top:10px}
.ok{color:#8ef0a9}.err{color:#ff8d9a}
</style>
</head>
<body>
<main>
<h1>インセイン キャラクター駒生成ツール</h1>
<p>v0.3 Debug — キャラクターシート倉庫から取得した「変換前の生データ」を確認するための調査版です。</p>
<section class="card">
<label>キャラクターシートURL</label>
<input id="url" placeholder="https://character-sheets.appspot.com/insane/edit.html?key=...">
<button id="load">読み込む</button>
<div id="status" class="status"></div>
</section>
<section class="card">
<h2>取得した生データ</h2>
<p>読み込み成功後、キャラクターシート倉庫から返ってきた内容を変換せず表示します。</p>
<button id="copy" class="secondary">生データをコピー</button>
<pre id="raw">まだ読み込まれていません。</pre>
</section>
</main>
<script>
let rawData=null;
const $=id=>document.getElementById(id);
function getKey(value){
  try{
    const u=new URL(value);
    return u.searchParams.get("key") || "";
  }catch(e){
    const m=String(value).match(/[?&]key=([^&#]+)/);
    return m ? decodeURIComponent(m[1]) : "";
  }
}
function jsonp(key){
  return new Promise((resolve,reject)=>{
    const cb="insaneRaw_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    const timer=setTimeout(()=>cleanup(new Error("タイムアウトしました")),15000);
    function cleanup(err,data){
      clearTimeout(timer);
      try{delete window[cb]}catch(e){window[cb]=undefined}
      script.remove();
      err?reject(err):resolve(data);
    }
    window[cb]=data=>cleanup(null,data);
    script.onerror=()=>cleanup(new Error("JSONPの読み込みに失敗しました"));
    script.src="https://character-sheets.appspot.com/insane/display?ajax=1&key="+encodeURIComponent(key)+"&callback="+encodeURIComponent(cb);
    document.head.appendChild(script);
  });
}
$("load").onclick=async()=>{
  const key=getKey($("url").value.trim());
  if(!key){$("status").textContent="URLからkeyを取得できませんでした。";$("status").className="status err";return}
  $("status").textContent="読み込み中…"; $("status").className="status";
  try{
    rawData=await jsonp(key);
    $("raw").textContent=JSON.stringify(rawData,null,2);
    $("status").textContent="取得成功。下の「取得した生データ」を確認してください。";
    $("status").className="status ok";
  }catch(e){
    $("status").textContent="取得失敗: "+e.message;
    $("status").className="status err";
  }
};
$("copy").onclick=async()=>{
  if(!rawData)return;
  await navigator.clipboard.writeText(JSON.stringify(rawData,null,2));
  $("status").textContent="生データをコピーしました。";
  $("status").className="status ok";
};
</script>
</body>
</html>
